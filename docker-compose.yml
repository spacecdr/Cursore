services:
  cursore-server:
    build:
      context: ./server
    container_name: cursore-server
    environment:
      CURSORE_HOST: 0.0.0.0
      CURSORE_PORT: 8766
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GROQ_LLM_MODEL: ${GROQ_LLM_MODEL:-openai/gpt-oss-20b}
      TTS_PROVIDER: ${TTS_PROVIDER:-gemini}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-3.1-flash-tts-preview}
      GEMINI_TTS_VOICE: ${GEMINI_TTS_VOICE:-Kore}
      PIPER_MODEL: ${PIPER_MODEL:-it_IT-riccardo-x_low}
    ports:
      - "127.0.0.1:8766:8766"
      - "192.168.123.5:8766:8766"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
