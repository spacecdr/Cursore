name: ESP-IDF build

on:
  push:
  pull_request:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    defaults:
      run:
        working-directory: firmware
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public credentials placeholder
        run: cp main/secrets.example.h main/secrets.h
      - name: Select original ESP32 target
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
      - name: Build firmware
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
